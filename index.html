<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba OAuth2 & JWT</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .card-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        /* Separador */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            gap: 10px;
        }

        .btn-google {
            background-color: #ffffff;
            color: #374151;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn-google:hover {
            background-color: #f9fafb;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            margin-top: 16px;
        }

        .btn-danger:hover {
            background-color: #fef2f2;
        }

        .user-info {
            background-color: #f9fafb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .badge {
            display: inline-block;
            background-color: #d1fae5;
            color: #065f46;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            resize: none;
            word-break: break-all;
        }

        .json-response {
            background-color: #1e293b;
            color: #38bdf8;
            padding: 14px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            text-align: left;
            margin-top: 12px;
            max-height: 160px;
            overflow-y: auto;
            display: none;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>Portal de Autenticación</h2>
            <p>Ingresa tus datos para continuar</p>
        </div>

        <div id="loggedOutSection">
            <form id="formNormalLogin">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="usuario@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                <p id="loginError" class="error-msg"></p>
            </form>

            <div class="divider">
                <span>o</span>
            </div>

            <button id="btnLoginGoogle" class="btn btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continuar con Google
            </button>
        </div>

        <div id="loggedInSection" style="display: none;">
            <div class="user-info">
                <span class="badge">● Autenticado</span>
                
                <div class="form-group">
                    <label>Usuario</label>
                    <span id="userEmail" style="font-weight: 600;"></span>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label>Bearer Token (JWT)</label>
                    <textarea id="tokenText" readonly></textarea>
                </div>
            </div>

            <button id="btnProbarPerfil" class="btn btn-primary">
                Probar Endpoint Protegido (/api/prueba/perfil)
            </button>

            <pre id="jsonResult" class="json-response"></pre>

            <button id="btnLogout" class="btn btn-danger">
                Cerrar Sesión
            </button>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5260";

        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        const emailFromUrl = urlParams.get('email');

        if (tokenFromUrl) {
            localStorage.setItem('jwt_token', tokenFromUrl);
            localStorage.setItem('user_email', emailFromUrl);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        const savedToken = localStorage.getItem('jwt_token');
        const savedEmail = localStorage.getItem('user_email');

        if (savedToken) {
            document.getElementById('loggedOutSection').style.display = 'none';
            document.getElementById('loggedInSection').style.display = 'block';
            document.getElementById('userEmail').innerText = savedEmail || "Usuario Autenticado";
            document.getElementById('tokenText').value = savedToken;
        }

        document.getElementById('formNormalLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginError');

            errorBox.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    localStorage.setItem('user_email', email);
                    window.location.reload();
                } else {
                    errorBox.style.display = 'block';
                    errorBox.innerText = data.message || 'Credenciales incorrectas.';
                }
            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.innerText = 'Error al conectar con el servidor.';
            }
        });

        document.getElementById('btnLoginGoogle').addEventListener('click', () => {
            const currentFrontendUrl = encodeURIComponent(window.location.href);
            window.location.href = `${API_URL}/api/oauth/google/login?redirectUrl=${currentFrontendUrl}`;
        });

        document.getElementById('btnProbarPerfil').addEventListener('click', async () => {
            const token = localStorage.getItem('jwt_token');
            const resultBox = document.getElementById('jsonResult');

            try {
                const response = await fetch(`${API_URL}/api/prueba/perfil`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                resultBox.style.display = 'block';
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultBox.style.display = 'block';
                resultBox.innerText = "Error: " + error.message;
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_email');
            window.location.reload();
        });
    </script>
</body>
</html>
